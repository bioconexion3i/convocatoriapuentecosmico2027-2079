services:
  faro_publisher:
    build: .
    container_name: faro_merida_engine
    environment:
      - MQTT_BROKER=host.docker.internal
      - MQTT_PORT=1884
      - LATITUD=20.9676
      - LONGITUD=-89.6237
      - NODO_ID=merida-avenida-yucatan
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
