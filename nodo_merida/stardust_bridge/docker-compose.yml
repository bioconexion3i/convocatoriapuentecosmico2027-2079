version: '3.8'
services:
  stardust-bridge:
    build: .
    container_name: stardust_bridge
    ports:
      - "0.0.0.0:8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - MQTT_BROKER=host.docker.internal
      - MQTT_PORT=1884
      - TZ=America/Merida
      - ORACULO_SALIDA=/data/oraculo
    env_file:
      - path: ../.env.lector
        required: false
    volumes:
      - ../oraculo_dia/salida:/data/oraculo:ro
    restart: unless-stopped
